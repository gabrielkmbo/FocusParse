# FocusParse default configuration.
#
# Model tiers and per-role assignment. Override at runtime via FOCUSPARSE_TIER_*
# env vars (see .env.example and .claude/settings.json).

tiers:
  cheap:
    provider: gemini
    model: gemini-2.5-flash
    max_tokens: 4096
    thinking_budget: 1024 # required for Gemini 2.5/3.x, else empty response
  mid:
    provider: anthropic
    model: claude-haiku-4-5
    max_tokens: 4096
  frontier:
    provider: openai
    model: gpt-5.4
    max_completion_tokens: 8192 # GPT-5.x requires this param name, not max_tokens

roles:
  planner: cheap
  router: cheap
  localizer_rerank: mid
  reasoner: frontier
  verifier: mid
  # 2026-05-11 (harness-growth-sprint Phase 2): inspector_dispatch is now
  # used by `_should_use_react_inspector` to LLM-route on hard cases
  # (fine-detail families, highres_tiny budget, low rerank confidence).
  # Mid-tier so dispatch is cheap (~$0.005 per affected example × ~30%
  # of examples = ~+$0.20 per n=148 run). Adding this role changes
  # `tier_sha8` so sprint runs land under a new namespace and do not
  # collide with rebaseline-v2's `7d4b816d`. The previous
  # comment-out (sprint 2026-05-04 Phase 1) was specifically to keep
  # rebaseline-v2 stable; now that it is stable, the role belongs here.
  inspector_dispatch: mid
  # Sprint Phase 1 (2026-05-04): inspector_dispatch was added back in a
  # follow-on commit AFTER the headline-v1 rebaseline run completed — the
  # tier_sha8 hashes the resolved role map, so adding a role mid-run
  # would split predictions across two namespaces and break the cell
  # aggregation. Re-add via a separate commit before Phase 1 A/B.

# Default budgets for `focus eval --agent focus`.
# Override on the CLI: --budget tokens=120k,tool_calls=12,crops=8
budget:
  tokens: 120_000
  tool_calls: 12
  crops: 8
  max_turns: 10
  max_vlm_calls: 4

# Per-stage escalation policy. When a step returns confidence < threshold, re-run
# that step one tier up (mid → frontier, cheap → mid). Never escalates more than
# one level, and never escalates more than one step per run.
escalation:
  confidence_threshold: 0.5
  max_steps_escalated_per_run: 1

# External endpoints.
endpoints:
  layout:
    url: https://jqkx3k3gn4ciymvi.us-east-1.aws.endpoints.huggingface.cloud
    # Shared with parser-bench — be a polite neighbor.
    rate_limit_rps: 2
    timeout_s: 180
    retries: 3

# Dataset source. `hf` streams from HuggingFace (default); `local` reads from a
# local parser-bench clone at the path below.
dataset:
  source: hf
  # Pinned 2026-05-04 to the HEAD of gabrielbo/parser-bench's main branch.
  # The headline-v1 run (2026-04-29) did not pin a revision; sprint A/Bs
  # under this plan should run against this fixed SHA so comparisons stay
  # apples-to-apples even if the benchmark advances mid-sprint.
  # Override with `--hf-revision <sha>` on `scripts/run_hf_eval.py` or via
  # env var FOCUSPARSE_DATASET_REVISION.
  hf_repo: gabrielbo/parser-bench
  revision: 3774c67f8b814392b6d04c939e904f749a3f52eb
  local_root: null # absolute path to a parser-bench checkout, or null

# NFS (processed docs — mirrors parser-bench contract).
nfs:
  host: llama-nfs
  remote_root: /home/osx-user/shared-experiments/llamacloud-bench-ci/data/parser-bench
  rsync_flags: [-a, -z] # archive + compress; no --delete, NFS is canonical

# Cache root for crops, OCR, layout, and per-run trace assets.
cache:
  root: ./cache

# Trace export defaults.
traces:
  # v3 (2026-05-06): RunTrace gains artifact refs + debug events for the
  # one-example dashboard. The runtime constant
  # in src/focusparse/traces/export.py is the load-bearing version; this
  # YAML field is informational only.
  schema_version: "3"
  sft_filter:
    min_coverage: 0.8 # AgenticOCR dual threshold — coverage recall
    min_iou: 0.3 # AgenticOCR dual threshold — spatial IoU
    require_correct: true # for SFT; GRPO variant keeps incorrect examples
