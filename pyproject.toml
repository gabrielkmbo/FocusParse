[project]
name = "focusparse"
version = "0.1.0"
description = "Agentic evidence-localization pipeline for high-resolution financial and datasheet QA"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Gabriel Bo" }]

dependencies = [
  # Orchestration
  "llama-index-workflows>=0.3.0",
  "llama-index-core>=0.12.0",
  # Model SDKs
  "anthropic>=0.40.0",
  "openai>=1.55.0",
  "google-genai>=0.3.0",
  # PDF + image
  "pymupdf>=1.24.0",
  "pillow>=10.0.0",
  "pytesseract>=0.3.10",
  # Data
  "datasets>=3.0.0",
  "pyarrow>=18.0.0",
  "pydantic>=2.9.0",
  "pyyaml>=6.0",
  # Retrieval (v1 FTS-only; visual rerank deferred)
  "rank-bm25>=0.2.2",
  "sqlite-utils>=3.37",
  # Telemetry / reports
  "rich>=13.9.0",
  "jinja2>=3.1.0",
  # HTTP
  "httpx>=0.27.0",
  "tenacity>=9.0.0",
  # CLI
  "typer>=0.12.0",
]

[project.optional-dependencies]
# Heavy/paid/GPU extras — all off by default (Phase 5+ ablations).
liteparse = []                                                # enable when Python subpkg stabilizes
llamacloud = ["llama-cloud>=0.1.0"]
visual-rerank = ["sentence-transformers>=3.0", "torch>=2.4"]  # DEFERRED — do not install in v1
chart-tools = ["matplotlib>=3.9", "numpy>=2.0", "scipy>=1.14"]
dev = [
  "ruff>=0.7",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "mypy>=1.11",
]

[project.scripts]
focus = "focusparse.cli.focus:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/focusparse"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line-length handled by formatter

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "slow: integration tests that hit real APIs (skipped by default)",
]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
